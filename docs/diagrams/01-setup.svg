<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" role="img" aria-label="Demo setup: on the laptop, a Claude Agent SDK orchestrator runs five agents that call the MCP server hosted by the Testkube control plane. The control plane hands runs to the Testkube runner agent in a local minikube cluster, which starts a pod per workflow, shard and worker, each testing a copy of the app started from the PR's source." font-family="Nunito, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818CF8"/>
    </marker>
  </defs>

  <!-- GitHub -->
  <rect x="30" y="85" width="330" height="190" rx="16" fill="#221848" stroke="#8B80D9" stroke-width="2.5"/>
  <text x="195" y="135" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">GitHub</text>
  <text x="195" y="180" text-anchor="middle" font-size="21" fill="#E4E1F5">Pull request</text>
  <text x="195" y="212" text-anchor="middle" font-size="21" fill="#E4E1F5">agent PR comments</text>
  <text x="195" y="244" text-anchor="middle" font-size="21" fill="#E4E1F5">quality-gate status</text>

  <!-- Laptop -->
  <rect x="460" y="30" width="670" height="885" rx="20" fill="none" stroke="#6E64B0" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="485" y="64" font-size="20" font-weight="700" fill="#FFAB40">LAPTOP</text>

  <!-- Orchestrator -->
  <rect x="490" y="85" width="620" height="215" rx="16" fill="#2B1F63" stroke="#818CF8" stroke-width="2.5"/>
  <text x="800" y="128" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">Quality loop orchestrator</text>
  <text x="800" y="158" text-anchor="middle" font-size="19" fill="#C4BFE6">Claude Agent SDK · TypeScript</text>
  <g text-anchor="middle" font-weight="700" fill="#E0E3FF">
    <rect x="496" y="195" width="112" height="72" rx="12" fill="#221848" stroke="#818CF8" stroke-width="2"/>
    <text x="552" y="227" font-size="18">Selector</text><text x="552" y="251" font-size="15" font-weight="400" fill="#C4BFE6">Sonnet</text>
    <rect x="620" y="195" width="112" height="72" rx="12" fill="#221848" stroke="#818CF8" stroke-width="2"/>
    <text x="676" y="227" font-size="18">Executor</text><text x="676" y="251" font-size="15" font-weight="400" fill="#C4BFE6">Haiku</text>
    <rect x="744" y="195" width="112" height="72" rx="12" fill="#221848" stroke="#818CF8" stroke-width="2"/>
    <text x="800" y="227" font-size="18">Triage</text><text x="800" y="251" font-size="15" font-weight="400" fill="#C4BFE6">Opus</text>
    <rect x="868" y="195" width="112" height="72" rx="12" fill="#221848" stroke="#818CF8" stroke-width="2"/>
    <text x="924" y="227" font-size="18">Remediator</text><text x="924" y="251" font-size="15" font-weight="400" fill="#C4BFE6">Opus</text>
    <rect x="992" y="195" width="112" height="72" rx="12" fill="#221848" stroke="#818CF8" stroke-width="2"/>
    <text x="1048" y="227" font-size="18">Gate</text><text x="1048" y="251" font-size="15" font-weight="400" fill="#C4BFE6">Sonnet</text>
  </g>

  <!-- Kubernetes cluster on the laptop -->
  <rect x="490" y="345" width="620" height="545" rx="18" fill="#1C1440" stroke="#8B80D9" stroke-width="2.5"/>
  <text x="512" y="380" font-size="22" font-weight="700" fill="#FFFFFF">Kubernetes cluster · minikube</text>

  <rect x="515" y="402" width="570" height="80" rx="14" fill="#221848" stroke="#FFAB40" stroke-width="2.5"/>
  <text x="800" y="437" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Testkube runner agent</text>
  <text x="800" y="465" text-anchor="middle" font-size="17" fill="#C4BFE6">starts a pod per workflow, shard and worker</text>

  <rect x="515" y="530" width="570" height="340" rx="14" fill="none" stroke="#6E64B0" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="532" y="556" font-size="16" fill="#A49DD0">one execution</text>
  <line x1="800" y1="482" x2="800" y2="526" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="815" y="510" font-size="17" fill="#C4BFE6">creates pods</text>

  <rect x="640" y="580" width="320" height="72" rx="14" fill="#143D2E" stroke="#4ADE80" stroke-width="2.5"/>
  <text x="800" y="612" text-anchor="middle" font-size="20" font-weight="700" fill="#BBF7D0">Plushie Shop pod</text>
  <text x="800" y="638" text-anchor="middle" font-size="16" fill="#86EFAC">started from the PR's source</text>

  <g text-anchor="middle" font-weight="700" fill="#FFFFFF" font-size="17">
    <rect x="519" y="770" width="86" height="64" rx="10" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
    <text x="562" y="808">unit</text>
    <rect x="614" y="770" width="86" height="64" rx="10" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
    <text x="657" y="798">API</text><text x="657" y="821" font-size="13" font-weight="400" fill="#C4BFE6">newman</text>
    <rect x="709" y="770" width="86" height="64" rx="10" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
    <text x="752" y="798">E2E 1</text><text x="752" y="821" font-size="13" font-weight="400" fill="#C4BFE6">Playwright</text>
    <rect x="804" y="770" width="86" height="64" rx="10" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
    <text x="847" y="798">E2E 2</text><text x="847" y="821" font-size="13" font-weight="400" fill="#C4BFE6">Playwright</text>
    <rect x="899" y="770" width="86" height="64" rx="10" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
    <text x="942" y="798">load 1</text><text x="942" y="821" font-size="13" font-weight="400" fill="#C4BFE6">k6</text>
    <rect x="994" y="770" width="86" height="64" rx="10" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
    <text x="1037" y="798">load 2</text><text x="1037" y="821" font-size="13" font-weight="400" fill="#C4BFE6">k6</text>
  </g>
  <line x1="800" y1="766" x2="800" y2="656" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="812" y="716" font-size="16" fill="#C4BFE6">HTTP</text>

  <!-- Claude API -->
  <rect x="1220" y="30" width="350" height="110" rx="16" fill="#221848" stroke="#8B80D9" stroke-width="2.5"/>
  <text x="1395" y="76" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">Claude API</text>
  <text x="1395" y="114" text-anchor="middle" font-size="20" fill="#E4E1F5">Opus · Sonnet · Haiku 5.5</text>

  <!-- Testkube control plane (cloud) -->
  <rect x="1220" y="165" width="350" height="335" rx="18" fill="#1C1440" stroke="#FFAB40" stroke-width="2.5"/>
  <text x="1240" y="196" font-size="17" font-weight="700" fill="#FFAB40">TESTKUBE CONTROL PLANE · CLOUD</text>

  <rect x="1240" y="210" width="310" height="64" rx="12" fill="#221848" stroke="#FFAB40" stroke-width="2"/>
  <text x="1395" y="238" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">MCP server</text>
  <text x="1395" y="261" text-anchor="middle" font-size="15" fill="#C4BFE6">hosted · …/environments/&lt;env&gt;/mcp</text>

  <rect x="1240" y="290" width="310" height="64" rx="12" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
  <text x="1395" y="318" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Results &amp; history</text>
  <text x="1395" y="341" text-anchor="middle" font-size="15" fill="#C4BFE6">runs · logs · artifacts · tags</text>

  <rect x="1240" y="410" width="310" height="64" rx="12" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
  <text x="1395" y="438" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Run dispatch</text>
  <text x="1395" y="461" text-anchor="middle" font-size="15" fill="#C4BFE6">hands out runs · collects results</text>

  <!-- arrows: GitHub <-> orchestrator -->
  <line x1="364" y1="150" x2="486" y2="150" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="370" y="138" font-size="18" fill="#C4BFE6">new PR</text>
  <line x1="486" y1="235" x2="364" y2="235" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="370" y="268" font-size="18" fill="#C4BFE6">comments</text>
  <text x="370" y="291" font-size="18" fill="#C4BFE6">fix commit</text>
  <text x="370" y="314" font-size="18" fill="#C4BFE6">status</text>

  <!-- orchestrator <-> Claude -->
  <line x1="1114" y1="110" x2="1216" y2="110" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="1176" y="98" text-anchor="middle" font-size="18" fill="#C4BFE6">prompts</text>

  <!-- orchestrator -> hosted MCP -->
  <line x1="1114" y1="242" x2="1236" y2="242" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="1176" y="230" text-anchor="middle" font-size="18" font-weight="700" fill="#FFAB40">MCP</text>
  <text x="1176" y="266" text-anchor="middle" font-size="16" fill="#C4BFE6">API token</text>

  <!-- dispatch <-> runner agent -->
  <line x1="1236" y1="442" x2="1089" y2="442" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- GitHub -> cluster (clone) -->
  <polyline points="195,279 195,700 486,700" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="212" y="680" font-size="18" fill="#C4BFE6">git clone @ PR commit</text>
  <text x="212" y="725" font-size="18" fill="#C4BFE6">(no image build)</text>
</svg>
