<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="How the quality-loop orchestrator is built: runLoop in loop.ts is plain TypeScript that calls five agents in order, with the fix loop as a bounded for-loop, and does all side effects itself. Each agent call goes through runAgent, which starts one Claude Code session with its own prompt, model, tool allow-list, hosted Testkube MCP connection with unused tools hidden, and a JSON-schema output. Triggers, outputs and support modules sit around it." font-family="Nunito, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#818CF8"/>
    </marker>
  </defs>
  <text x="470" y="50" font-size="20" font-weight="700" fill="#FFAB40">ORCHESTRATION</text>
    <rect x="470" y="70" width="660" height="500" rx="16" fill="#1C1440" stroke="#818CF8" stroke-width="2.5"/>
  <text x="495" y="108" font-size="22" font-weight="700" fill="#FFFFFF">runLoop(pr)</text>
  <text x="640" y="108" font-size="17" fill="#C4BFE6">loop.ts · plain TypeScript</text>
  <text x="495" y="134" font-size="16" fill="#A49DD0">control flow, guardrails and side effects live here, not in a model</text>
  <text x="495" y="178" font-size="16" fill="#E4E1F5" font-family="'SF Mono', Menlo, monospace" xml:space="preserve">prepareWorktree(pr)</text>
  <rect x="950" y="159" width="160" height="25" rx="12.5" fill="none" stroke="#6E64B0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1030" y="177" text-anchor="middle" font-size="15" fill="#C4BFE6">git</text>
  <text x="495" y="209" font-size="16" fill="#E4E1F5" font-family="'SF Mono', Menlo, monospace" xml:space="preserve">plan = selectTests(pr, diff)</text>
  <rect x="950" y="190" width="160" height="25" rx="12.5" fill="#2B1F63" stroke="#818CF8" stroke-width="2"/>
  <text x="1030" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Selector</text>
  <text x="495" y="240" font-size="16" fill="#E4E1F5" font-family="'SF Mono', Menlo, monospace" xml:space="preserve">for (round = 1; ; round++) {</text>
  <text x="523" y="271" font-size="16" fill="#E4E1F5" font-family="'SF Mono', Menlo, monospace" xml:space="preserve">runs = executePlan(plan, sha)</text>
  <rect x="950" y="252" width="160" height="25" rx="12.5" fill="#2B1F63" stroke="#818CF8" stroke-width="2"/>
  <text x="1030" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Executor</text>
  <text x="523" y="302" font-size="16" fill="#E4E1F5" font-family="'SF Mono', Menlo, monospace" xml:space="preserve">if (allPassed || round &gt; MAX) break</text>
  <text x="523" y="333" font-size="16" fill="#E4E1F5" font-family="'SF Mono', Menlo, monospace" xml:space="preserve">triage = parallel(triageFailure)</text>
  <rect x="950" y="314" width="160" height="25" rx="12.5" fill="#2B1F63" stroke="#818CF8" stroke-width="2"/>
  <text x="1030" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Triage ×N</text>
  <text x="523" y="364" font-size="16" fill="#E4E1F5" font-family="'SF Mono', Menlo, monospace" xml:space="preserve">tagTriage(triage)</text>
  <rect x="950" y="345" width="160" height="25" rx="12.5" fill="none" stroke="#6E64B0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1030" y="363" text-anchor="middle" font-size="15" fill="#C4BFE6">Testkube MCP</text>
  <text x="523" y="395" font-size="16" fill="#E4E1F5" font-family="'SF Mono', Menlo, monospace" xml:space="preserve">fix = remediate(pr, triage)</text>
  <rect x="950" y="376" width="160" height="25" rx="12.5" fill="#2B1F63" stroke="#818CF8" stroke-width="2"/>
  <text x="1030" y="394" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Remediator</text>
  <text x="523" y="426" font-size="16" fill="#E4E1F5" font-family="'SF Mono', Menlo, monospace" xml:space="preserve">sha = pushFix(); quarantine()</text>
  <rect x="950" y="407" width="160" height="25" rx="12.5" fill="none" stroke="#6E64B0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1030" y="425" text-anchor="middle" font-size="15" fill="#C4BFE6">git · MCP</text>
  <text x="495" y="457" font-size="16" fill="#E4E1F5" font-family="'SF Mono', Menlo, monospace" xml:space="preserve">}</text>
  <text x="495" y="488" font-size="16" fill="#E4E1F5" font-family="'SF Mono', Menlo, monospace" xml:space="preserve">gate = reportGate(pr, sha, summary)</text>
  <rect x="950" y="469" width="160" height="25" rx="12.5" fill="#2B1F63" stroke="#818CF8" stroke-width="2"/>
  <text x="1030" y="487" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Gate</text>
  <text x="495" y="519" font-size="16" fill="#E4E1F5" font-family="'SF Mono', Menlo, monospace" xml:space="preserve">setStatus(); comment(); writeManifest()</text>
  <rect x="950" y="500" width="160" height="25" rx="12.5" fill="none" stroke="#6E64B0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1030" y="518" text-anchor="middle" font-size="15" fill="#C4BFE6">gh · file</text>
  <path d="M 484 226 L 478 226 L 478 461 L 484 461" fill="none" stroke="#FFAB40" stroke-width="2"/>
  <line x1="490" y1="536" x2="1110" y2="536" stroke="#4A3F85" stroke-width="1.5"/>
  <text x="495" y="557" font-size="15" fill="#FFAB40">↻ the for-loop is the fix loop · MAX = 2 fix rounds</text>
  <rect x="905" y="544" width="18" height="14" rx="7" fill="#2B1F63" stroke="#818CF8" stroke-width="1.5"/>
  <text x="929" y="557" font-size="14" fill="#C4BFE6">agent</text>
  <rect x="985" y="544" width="18" height="14" rx="7" fill="none" stroke="#6E64B0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1009" y="557" font-size="14" fill="#C4BFE6">plain code</text>
  <line x1="1030" y1="570" x2="1030" y2="606" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1045" y="594" font-size="16" fill="#C4BFE6">every agent call</text>
  <rect x="470" y="610" width="660" height="370" rx="16" fill="#2B1F63" stroke="#818CF8" stroke-width="2.5"/>
  <text x="495" y="648" font-size="22" font-weight="700" fill="#FFFFFF">runAgent(spec)</text>
  <text x="665" y="648" font-size="17" fill="#C4BFE6">lib/agent.ts · Agent SDK query()</text>
  <text x="495" y="674" font-size="16" fill="#C4BFE6">one short-lived Claude Code session per call</text>
  <text x="495" y="712" font-size="14" font-weight="700" fill="#FFAB40" letter-spacing="0.5">PROMPT</text>
  <text x="625" y="712" font-size="17" fill="#FFFFFF">prompts/&lt;agent&gt;.md</text>
  <text x="495" y="742" font-size="14" font-weight="700" fill="#FFAB40" letter-spacing="0.5">MODEL</text>
  <text x="625" y="742" font-size="17" fill="#FFFFFF">Opus · Sonnet · Haiku 5.5, effort per agent</text>
  <text x="495" y="772" font-size="14" font-weight="700" fill="#FFAB40" letter-spacing="0.5">TOOLS</text>
  <text x="625" y="772" font-size="17" fill="#FFFFFF">built-ins per agent: Read · Grep · Edit · Bash(git, npm test)</text>
  <text x="495" y="802" font-size="14" font-weight="700" fill="#FFAB40" letter-spacing="0.5">PERMISSIONS</text>
  <text x="625" y="802" font-size="17" fill="#FFFFFF">allowedTools + dontAsk: anything else is denied</text>
  <text x="495" y="832" font-size="14" font-weight="700" fill="#FFAB40" letter-spacing="0.5">TESTKUBE</text>
  <text x="625" y="832" font-size="17" fill="#FFFFFF">hosted MCP · HTTP + API token · unused tools hidden</text>
  <text x="495" y="862" font-size="14" font-weight="700" fill="#FFAB40" letter-spacing="0.5">OUTPUT</text>
  <text x="625" y="862" font-size="17" fill="#FFFFFF">JSON schema (zod) → validated, typed object</text>
  <text x="495" y="892" font-size="14" font-weight="700" fill="#FFAB40" letter-spacing="0.5">WORKING DIR</text>
  <text x="625" y="892" font-size="17" fill="#FFFFFF">the PR worktree (Triage, Remediator)</text>
  <text x="495" y="922" font-size="14" font-weight="700" fill="#FFAB40" letter-spacing="0.5">GUARD</text>
  <text x="625" y="922" font-size="17" fill="#FFFFFF">Testkube MCP not connected at start → retry ×3</text>
  <text x="495" y="952" font-size="14" font-weight="700" fill="#FFAB40" letter-spacing="0.5">RETURNS</text>
  <text x="625" y="952" font-size="17" fill="#FFFFFF">output · session id · tokens · cost</text>
  <text x="30" y="50" font-size="20" font-weight="700" fill="#FFAB40">TRIGGERS</text>
  <rect x="30" y="70" width="380" height="90" rx="14" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
  <text x="52" y="108" font-size="19" fill="#FFFFFF" font-family="'SF Mono', Menlo, monospace">npm run loop -- --pr 12</text>
  <text x="52" y="138" font-size="16" fill="#C4BFE6">one PR, on demand</text>
  <rect x="30" y="180" width="380" height="90" rx="14" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
  <text x="52" y="218" font-size="19" fill="#FFFFFF" font-family="'SF Mono', Menlo, monospace">npm run watch</text>
  <text x="52" y="248" font-size="16" fill="#C4BFE6">polls GitHub every 5 s · runs each new PR</text>
  <polyline points="410,115 438,115 438,160 466,160" fill="none" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polyline points="410,225 438,225 438,160" fill="none" stroke="#818CF8" stroke-width="2.5"/>
  <text x="30" y="340" font-size="20" font-weight="700" fill="#FFAB40">OUTPUTS</text>
  <rect x="30" y="360" width="380" height="110" rx="14" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
  <text x="52" y="396" font-size="19" font-weight="700" fill="#FFFFFF">Terminal</text>
  <text x="52" y="426" font-size="16" fill="#C4BFE6">colour-coded stream of every agent:</text>
  <text x="52" y="450" font-size="16" fill="#C4BFE6">tool calls, verdicts, AI spend</text>
  <rect x="30" y="490" width="380" height="110" rx="14" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
  <text x="52" y="526" font-size="19" font-weight="700" fill="#FFFFFF">GitHub</text>
  <text x="52" y="556" font-size="16" fill="#C4BFE6">a comment per step, fix commits,</text>
  <text x="52" y="580" font-size="16" fill="#C4BFE6">quality-gate commit status</text>
  <rect x="30" y="620" width="380" height="110" rx="14" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
  <text x="52" y="656" font-size="19" font-weight="700" fill="#FFFFFF" font-family="'SF Mono', Menlo, monospace">runs/pr-&lt;n&gt;.json</text>
  <text x="52" y="686" font-size="16" fill="#C4BFE6">per session: agent, tools it could see,</text>
  <text x="52" y="710" font-size="16" fill="#C4BFE6">tokens, cost, transcript to resume</text>
  <polyline points="470,440 440,440 440,415 414,415" fill="none" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1180" y="50" font-size="20" font-weight="700" fill="#FFAB40">SUPPORT MODULES · lib/</text>
  <rect x="1180" y="70" width="390" height="110" rx="14" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
  <text x="1202" y="106" font-size="19" font-weight="700" fill="#FFFFFF" font-family="'SF Mono', Menlo, monospace">github.ts</text>
  <text x="1548" y="106" text-anchor="end" font-size="16" font-weight="700" fill="#FFAB40">→ GitHub</text>
  <text x="1202" y="136" font-size="16" fill="#C4BFE6">gh CLI: PR, diff, comments,</text>
  <text x="1202" y="160" font-size="16" fill="#C4BFE6">commit status · retries network errors</text>
  <rect x="1180" y="195" width="390" height="110" rx="14" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
  <text x="1202" y="231" font-size="19" font-weight="700" fill="#FFFFFF" font-family="'SF Mono', Menlo, monospace">testkube.ts</text>
  <text x="1548" y="231" text-anchor="end" font-size="16" font-weight="700" fill="#FFAB40">→ Testkube MCP</text>
  <text x="1202" y="261" font-size="16" fill="#C4BFE6">MCP client for code-side calls: tags,</text>
  <text x="1202" y="285" font-size="16" fill="#C4BFE6">quarantine, dashboard links, tool list</text>
  <rect x="1180" y="320" width="390" height="110" rx="14" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
  <text x="1202" y="356" font-size="19" font-weight="700" fill="#FFFFFF" font-family="'SF Mono', Menlo, monospace">schemas.ts</text>
  <text x="1202" y="386" font-size="16" fill="#C4BFE6">zod contracts between agents:</text>
  <text x="1202" y="410" font-size="16" fill="#C4BFE6">TestPlan, TriageReport, GateReport, …</text>
  <rect x="1180" y="445" width="390" height="110" rx="14" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
  <text x="1202" y="481" font-size="19" font-weight="700" fill="#FFFFFF" font-family="'SF Mono', Menlo, monospace">spend.ts</text>
  <text x="1202" y="511" font-size="16" fill="#C4BFE6">tokens and estimated cost</text>
  <text x="1202" y="535" font-size="16" fill="#C4BFE6">per session and model</text>
  <rect x="1180" y="570" width="390" height="110" rx="14" fill="#221848" stroke="#8B80D9" stroke-width="2"/>
  <text x="1202" y="606" font-size="19" font-weight="700" fill="#FFFFFF" font-family="'SF Mono', Menlo, monospace">ui.ts</text>
  <text x="1202" y="636" font-size="16" fill="#C4BFE6">terminal rendering of the SDK</text>
  <text x="1202" y="660" font-size="16" fill="#C4BFE6">message stream, per agent</text>
  <line x1="1130" y1="280" x2="1176" y2="280" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1153" y="268" text-anchor="middle" font-size="14" fill="#C4BFE6">uses</text>
  <rect x="1180" y="705" width="390" height="275" rx="14" fill="none" stroke="#FFAB40" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1202" y="742" font-size="17" font-weight="700" fill="#FFAB40">EACH AGENT SESSION REACHES</text>
  <text x="1202" y="780" font-size="19" fill="#FFFFFF">· Claude API (its model)</text>
  <text x="1202" y="812" font-size="19" fill="#FFFFFF">· Testkube MCP, hosted</text>
  <text x="1202" y="844" font-size="19" fill="#FFFFFF">· the PR worktree on disk</text>
  <text x="1202" y="890" font-size="15" fill="#A49DD0">and nothing else: no web tools, no other</text>
  <text x="1202" y="912" font-size="15" fill="#A49DD0">MCP servers, no claude.ai connectors,</text>
  <text x="1202" y="934" font-size="15" fill="#A49DD0">no project or user settings</text>
  <line x1="1130" y1="840" x2="1176" y2="840" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
