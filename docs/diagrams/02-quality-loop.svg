<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 660" role="img" aria-label="The PR quality loop: the Selector plans which Testkube workflows to run and the Executor runs them on Kubernetes. If anything fails, one Triage agent per failure classifies it and the Remediator fixes the code or quarantines a flake, then the loop goes back to Execute with the same plan at the new commit, for at most two fix rounds. When everything passes, or the rounds are used up, the Gate sets the PR status check." font-family="Nunito, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818CF8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F87171"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ADE80"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFAB40"/>
    </marker>
  </defs>

  <!-- top row -->
  <rect x="30" y="110" width="200" height="110" rx="16" fill="#221848" stroke="#8B80D9" stroke-width="2.5"/>
  <text x="130" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">PR opened</text>
  <text x="130" y="190" text-anchor="middle" font-size="18" fill="#C4BFE6">GitHub</text>

  <rect x="300" y="110" width="240" height="110" rx="16" fill="#2B1F63" stroke="#818CF8" stroke-width="2.5"/>
  <text x="420" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">1 · Select</text>
  <text x="420" y="190" text-anchor="middle" font-size="18" fill="#C4BFE6">Selector · Sonnet</text>

  <rect x="610" y="110" width="240" height="110" rx="16" fill="#2B1F63" stroke="#818CF8" stroke-width="2.5"/>
  <text x="730" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">2 · Execute</text>
  <text x="730" y="190" text-anchor="middle" font-size="18" fill="#C4BFE6">Executor · Haiku</text>

  <polygon points="1000,105 1090,165 1000,225 910,165" fill="#221848" stroke="#8B80D9" stroke-width="2.5"/>
  <text x="1000" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">all</text>
  <text x="1000" y="184" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">passed?</text>

  <rect x="1250" y="110" width="240" height="110" rx="16" fill="#2B1F63" stroke="#818CF8" stroke-width="2.5"/>
  <text x="1370" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">5 · Gate</text>
  <text x="1370" y="190" text-anchor="middle" font-size="18" fill="#C4BFE6">Gate · Sonnet</text>

  <rect x="1550" y="125" width="150" height="80" rx="40" fill="#143D2E" stroke="#4ADE80" stroke-width="2.5"/>
  <text x="1625" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#BBF7D0">✓ status</text>
  <text x="1625" y="184" text-anchor="middle" font-size="16" fill="#86EFAC">quality-gate</text>

  <!-- bottom row: the fix loop -->
  <rect x="560" y="420" width="240" height="110" rx="16" fill="#2B1F63" stroke="#818CF8" stroke-width="2.5"/>
  <text x="680" y="466" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">4 · Remediate</text>
  <text x="680" y="498" text-anchor="middle" font-size="18" fill="#C4BFE6">Remediator · Opus</text>

  <rect x="880" y="420" width="240" height="110" rx="16" fill="#2B1F63" stroke="#818CF8" stroke-width="2.5"/>
  <text x="1000" y="466" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">3 · Triage ×N</text>
  <text x="1000" y="498" text-anchor="middle" font-size="18" fill="#C4BFE6">one per failure · Opus</text>

  <!-- arrows top row -->
  <line x1="230" y1="165" x2="296" y2="165" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="263" y="150" text-anchor="middle" font-size="17" fill="#C4BFE6">diff</text>
  <line x1="540" y1="165" x2="606" y2="165" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="573" y="96" text-anchor="middle" font-size="17" fill="#C4BFE6">test plan</text>
  <line x1="573" y1="102" x2="573" y2="160" stroke="#4A3F85" stroke-width="1.5"/>
  <line x1="850" y1="165" x2="906" y2="165" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="878" y="96" text-anchor="middle" font-size="17" fill="#C4BFE6">results</text>
  <line x1="878" y1="102" x2="878" y2="160" stroke="#4A3F85" stroke-width="1.5"/>
  <line x1="1090" y1="165" x2="1246" y2="165" stroke="#4ADE80" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1168" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#4ADE80">yes</text>
  <text x="1168" y="192" text-anchor="middle" font-size="15" fill="#A49DD0">or fix rounds</text>
  <text x="1168" y="210" text-anchor="middle" font-size="15" fill="#A49DD0">used up</text>
  <line x1="1490" y1="165" x2="1546" y2="165" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- no: down to triage -->
  <line x1="1000" y1="225" x2="1000" y2="416" stroke="#F87171" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="1015" y="320" font-size="18" font-weight="700" fill="#F87171">no: failed executions</text>

  <!-- triage -> remediate -->
  <line x1="880" y1="475" x2="804" y2="475" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="840" y="570" text-anchor="middle" font-size="17" fill="#C4BFE6">bug · test defect</text>
  <text x="840" y="592" text-anchor="middle" font-size="17" fill="#C4BFE6">flake · infra</text>
  <line x1="840" y1="548" x2="840" y2="480" stroke="#4A3F85" stroke-width="1.5"/>

  <!-- the loop: remediate -> back to execute -->
  <line x1="730" y1="420" x2="730" y2="224" stroke="#FFAB40" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="745" y="290" font-size="18" font-weight="700" fill="#FFAB40">fix commit or quarantine</text>
  <text x="745" y="314" font-size="18" fill="#FFAB40">↩ same plan @ new commit</text>
  <text x="745" y="338" font-size="16" fill="#A49DD0">max 2 fix rounds</text>

  <!-- Testkube MCP band -->
  <rect x="300" y="618" width="1190" height="34" rx="8" fill="#1C1440"/>
  <text x="895" y="641" text-anchor="middle" font-size="17" fill="#E4E1F5">Every step reads and writes Testkube through MCP: workflows · runs · logs · artifacts · history · tags</text>
</svg>
