<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 660" role="img" aria-label="The PR quality loop: the Selector plans which Testkube workflows to run, the Executor runs them on Kubernetes; if anything fails, one Triage agent per failure classifies it, the Remediator fixes the code or quarantines a flake, the Executor verifies on the new commit, and the Gate sets the PR status check." font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1720" height="660" fill="#ffffff"/>

  <!-- top row: happy path -->
  <rect x="30" y="110" width="200" height="110" rx="16" fill="#f9fafb" stroke="#1f2937" stroke-width="2.5"/>
  <text x="130" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">PR opened</text>
  <text x="130" y="190" text-anchor="middle" font-size="18" fill="#4b5563">GitHub</text>

  <rect x="300" y="110" width="240" height="110" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="420" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">1 · Select</text>
  <text x="420" y="190" text-anchor="middle" font-size="18" fill="#4b5563">Selector · Sonnet</text>

  <rect x="610" y="110" width="240" height="110" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="730" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">2 · Execute</text>
  <text x="730" y="190" text-anchor="middle" font-size="18" fill="#4b5563">Executor · Haiku</text>

  <polygon points="1000,105 1090,165 1000,225 910,165" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="1000" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">all</text>
  <text x="1000" y="184" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">passed?</text>

  <rect x="1250" y="110" width="240" height="110" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="1370" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">6 · Gate</text>
  <text x="1370" y="190" text-anchor="middle" font-size="18" fill="#4b5563">Gate · Sonnet</text>

  <rect x="1550" y="125" width="150" height="80" rx="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1625" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#14532d">✓ status</text>
  <text x="1625" y="184" text-anchor="middle" font-size="16" fill="#166534">quality-gate</text>

  <!-- bottom row: repair path -->
  <rect x="610" y="420" width="240" height="110" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="730" y="466" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">3 · Triage ×N</text>
  <text x="730" y="498" text-anchor="middle" font-size="18" fill="#4b5563">one per failure · Opus</text>

  <rect x="930" y="420" width="240" height="110" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="1050" y="466" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">4 · Remediate</text>
  <text x="1050" y="498" text-anchor="middle" font-size="18" fill="#4b5563">Remediator · Opus</text>

  <rect x="1250" y="420" width="240" height="110" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="1370" y="466" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">5 · Verify</text>
  <text x="1370" y="498" text-anchor="middle" font-size="18" fill="#4b5563">Executor · Haiku</text>

  <!-- arrows top row -->
  <line x1="230" y1="165" x2="296" y2="165" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="263" y="150" text-anchor="middle" font-size="17" fill="#4b5563">diff</text>
  <line x1="540" y1="165" x2="606" y2="165" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="573" y="96" text-anchor="middle" font-size="17" fill="#4b5563">test plan</text>
  <line x1="573" y1="102" x2="573" y2="160" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="850" y1="165" x2="906" y2="165" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="878" y="96" text-anchor="middle" font-size="17" fill="#4b5563">results</text>
  <line x1="878" y1="102" x2="878" y2="160" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="1090" y1="165" x2="1246" y2="165" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1168" y="150" text-anchor="middle" font-size="18" font-weight="600" fill="#16a34a">yes</text>
  <line x1="1490" y1="165" x2="1546" y2="165" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- no branch -->
  <polyline points="1000,225 1000,320 730,320 730,416" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="1015" y="275" font-size="18" font-weight="600" fill="#dc2626">no: failed executions</text>

  <!-- bottom row arrows -->
  <line x1="850" y1="475" x2="926" y2="475" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="888" y="568" text-anchor="middle" font-size="17" fill="#4b5563">bug · test defect</text>
  <text x="888" y="590" text-anchor="middle" font-size="17" fill="#4b5563">flake · infra</text>
  <line x1="888" y1="545" x2="888" y2="480" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="1170" y1="475" x2="1246" y2="475" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1208" y="568" text-anchor="middle" font-size="17" fill="#4b5563">fix commit</text>
  <text x="1208" y="590" text-anchor="middle" font-size="17" fill="#4b5563">or quarantine</text>
  <line x1="1208" y1="545" x2="1208" y2="480" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="1370" y1="420" x2="1370" y2="224" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1385" y="330" font-size="18" font-weight="600" fill="#16a34a">green on</text>
  <text x="1385" y="353" font-size="18" font-weight="600" fill="#16a34a">new commit</text>

  <!-- Testkube MCP band -->
  <rect x="300" y="618" width="1190" height="34" rx="8" fill="#f3f4f6"/>
  <text x="895" y="641" text-anchor="middle" font-size="17" fill="#374151">Every step reads and writes Testkube through MCP: workflows · runs · logs · artifacts · history · tags</text>
</svg>
