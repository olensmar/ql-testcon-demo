<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="The Gate agent queries every Testkube execution tagged with the PR, with its revision, status and triage tag, and applies the gate rules: every selected workflow must pass on the head commit, fixed failures and confirmed flakes don't block. It outputs the quality-gate commit status, a confidence score and the final PR comment." font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="#ffffff"/>

  <!-- evidence -->
  <text x="40" y="60" font-size="20" font-weight="700" fill="#6b7280">EVIDENCE IN TESTKUBE · executions tagged pr=5</text>
  <text x="40" y="88" font-size="16" fill="#6b7280" font-family="'SF Mono', Menlo, monospace">query_executions  tagSelector=pr=5</text>
  <rect x="40" y="105" width="660" height="560" rx="14" fill="#f9fafb" stroke="#1f2937" stroke-width="2"/>
  <g font-size="16" font-weight="700" fill="#6b7280">
    <text x="62" y="140">EXECUTION</text><text x="330" y="140">REVISION</text><text x="450" y="140">STATUS</text><text x="570" y="140">TRIAGE</text>
  </g>
  <line x1="60" y1="152" x2="680" y2="152" stroke="#d1d5db" stroke-width="1.5"/>
  <g font-size="17" font-family="'SF Mono', Menlo, monospace" fill="#1f2937">
    <text x="62" y="185">shop-unit-9</text><text x="330" y="185">ddee54c</text>
    <text x="62" y="220">shop-api-checkout-9</text><text x="330" y="220">ddee54c</text>
    <text x="62" y="255">shop-e2e-checkout-10</text><text x="330" y="255">ddee54c</text>
    <text x="62" y="290">shop-e2e-browse-9</text><text x="330" y="290">ddee54c</text>
    <text x="62" y="325">shop-e2e-browse-10</text><text x="330" y="325">ddee54c</text>
    <text x="62" y="360">shop-load-checkout-9</text><text x="330" y="360">ddee54c</text>
  </g>
  <g font-size="17" font-weight="700">
    <text x="450" y="185" fill="#16a34a">passed</text>
    <text x="450" y="220" fill="#dc2626">failed</text>
    <text x="450" y="255" fill="#dc2626">failed</text>
    <text x="450" y="290" fill="#dc2626">failed</text>
    <text x="450" y="325" fill="#16a34a">passed</text>
    <text x="450" y="360" fill="#16a34a">passed</text>
  </g>
  <g font-size="16" font-weight="600">
    <text x="570" y="220" fill="#b91c1c">product-bug</text>
    <text x="570" y="255" fill="#b91c1c">product-bug</text>
    <text x="570" y="290" fill="#b45309">flake</text>
    <text x="570" y="325" fill="#6b7280">(re-run)</text>
  </g>
  <rect x="60" y="385" width="620" height="34" rx="8" fill="#eef2ff"/>
  <text x="74" y="408" font-size="16" font-weight="700" fill="#3730a3">fix pushed: bbc6211 · verification run (browse quarantined)</text>
  <g font-size="17" font-family="'SF Mono', Menlo, monospace" fill="#1f2937">
    <text x="62" y="455">shop-unit-10</text><text x="330" y="455">bbc6211</text>
    <text x="62" y="490">shop-api-checkout-10</text><text x="330" y="490">bbc6211</text>
    <text x="62" y="525">shop-e2e-checkout-11</text><text x="330" y="525">bbc6211</text>
    <text x="62" y="560">shop-load-checkout-10</text><text x="330" y="560">bbc6211</text>
  </g>
  <g font-size="17" font-weight="700" fill="#16a34a">
    <text x="450" y="455">passed</text><text x="450" y="490">passed</text><text x="450" y="525">passed</text><text x="450" y="560">passed</text>
  </g>
  <text x="62" y="620" font-size="16" fill="#6b7280">Tags come from the workflows (pr, revision) and from triage.</text>
  <text x="62" y="644" font-size="16" fill="#6b7280">Records from demo PR #5.</text>

  <line x1="700" y1="385" x2="756" y2="385" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- gate agent -->
  <rect x="760" y="175" width="420" height="420" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="970" y="222" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Gate agent</text>
  <text x="970" y="250" text-anchor="middle" font-size="17" fill="#4b5563">Sonnet · rules applied to the evidence</text>
  <g font-size="19" fill="#312e81">
    <text x="788" y="300" font-weight="700">Pass only if</text>
    <text x="788" y="330">· every selected workflow passed</text>
    <text x="803" y="356">  on the head commit</text>
    <text x="788" y="400" font-weight="700">Don't block on</text>
    <text x="788" y="430">· failures that were fixed + verified</text>
    <text x="788" y="460">· flakes confirmed by a re-run</text>
    <text x="788" y="504" font-weight="700">Confidence from</text>
    <text x="788" y="534">· test levels covered</text>
    <text x="788" y="564">· final-commit evidence, flakiness</text>
  </g>

  <!-- outputs -->
  <line x1="1180" y1="385" x2="1236" y2="385" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1240" y="60" font-size="20" font-weight="700" fill="#6b7280">OUTPUTS</text>
  <rect x="1240" y="175" width="320" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1262" y="215" font-size="22" font-weight="700" fill="#14532d">✓ quality-gate</text>
  <text x="1262" y="246" font-size="17" fill="#166534">commit status on bbc6211</text>
  <text x="1262" y="272" font-size="17" fill="#166534">with a one-line headline</text>

  <rect x="1240" y="325" width="320" height="110" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="1262" y="365" font-size="22" font-weight="700" fill="#1f2937">Confidence 0–100</text>
  <text x="1262" y="396" font-size="17" fill="#4b5563">lowered by quarantined</text>
  <text x="1262" y="420" font-size="17" fill="#4b5563">or flaky coverage</text>

  <rect x="1240" y="465" width="320" height="130" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="1262" y="505" font-size="22" font-weight="700" fill="#1f2937">Final PR comment</text>
  <text x="1262" y="536" font-size="17" fill="#4b5563">verdict · per-workflow table</text>
  <text x="1262" y="560" font-size="17" fill="#4b5563">caught → triaged → fixed</text>
  <text x="1262" y="584" font-size="17" fill="#4b5563">→ verified</text>
</svg>
