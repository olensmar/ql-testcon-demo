<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Testkube plushie">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#6A45F2"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A45F2"/>
      <stop offset="1" stop-color="#5233D6"/>
    </linearGradient>
  </defs>
  <!-- legs -->
  <rect x="68" y="168" width="28" height="36" rx="11" fill="url(#leg)"/>
  <rect x="104" y="168" width="28" height="36" rx="11" fill="url(#leg)"/>
  <!-- body -->
  <rect x="26" y="22" width="148" height="156" rx="34" fill="url(#body)"/>
  <!-- soft top highlight -->
  <rect x="38" y="28" width="124" height="34" rx="17" fill="#B9A3FF" opacity="0.45"/>
  <!-- Testkube logo: a cube inside a diamond -->
  <g fill="none" stroke="#4A2FC0" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M100 58 L126 84 L100 110 L74 84 Z"/>
    <path d="M100 70 L114 78 L114 93 L100 101 L86 93 L86 78 Z"/>
    <path d="M86 78 L100 86 L114 78 M100 86 L100 101"/>
  </g>
  <!-- eyes -->
  <circle cx="64" cy="130" r="5.5" fill="#2B1670"/>
  <circle cx="136" cy="130" r="5.5" fill="#2B1670"/>
</svg>
