kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: shop-e2e-browse
  namespace: testkube
  labels:
    demo: testcon
    type: e2e
    service: catalog
description: >-
  Playwright browser tests for browsing the shop UI: product catalog rendering and adding
  items to the cart (app/public/index.html, catalog and cart APIs). Does not exercise checkout.
  Runs against an ephemeral copy of the app started from source at the given revision.
spec:
  config:
    revision:
      type: string
      default: main
      description: Git branch or commit SHA of github.com/olensmar/ql-testcon-demo to test
    pr:
      type: string
      default: ""
      description: Pull request number that triggered this run (for traceability)
    chaos:
      type: string
      default: "off"
      description: >-
        Fault injection. "odd" or "even" adds 3s of catalog latency on odd or even execution
        numbers, simulating an intermittently slow upstream. "off" disables it.
  execution:
    tags:
      pr: "{{config.pr}}"
      revision: "{{config.revision}}"
  content:
    git:
      uri: https://github.com/olensmar/ql-testcon-demo
      revision: "{{config.revision}}"
      paths: [app, tests/e2e]
  services:
    shop:
      image: node:22-alpine
      transfer:
        - from: /data/repo/app
          to: /app
      env:
        - name: CATALOG_LATENCY_MS
          value: "{{ config.chaos != 'off' && int(execution.number) % 2 == (config.chaos == 'odd' ? 1 : 0) ? 3000 : 0 }}"
      shell: node /app/src/server.ts
      readinessProbe:
        httpGet:
          path: /healthz
          port: 3000
        periodSeconds: 1
  container:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    workingDir: /data/repo/tests/e2e
    env:
      - name: CI
        value: "true"
  steps:
    - name: Install dependencies
      shell: npm ci --no-audit --no-fund
    - name: Run browse E2E tests
      container:
        env:
          - name: BASE_URL
            value: "http://{{services.shop.0.ip}}:3000"
      shell: npx playwright test browse.spec.ts
      artifacts:
        paths: ["results/**", "test-results/**"]
