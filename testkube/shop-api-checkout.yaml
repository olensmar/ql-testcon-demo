kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: shop-api-checkout
  namespace: testkube
  labels:
    demo: testcon
    type: api
    service: checkout
description: >-
  Postman/newman API tests for POST /api/checkout: order subtotal, shipping fee rules
  (free over $50, otherwise $5), totals and input validation. Covers app/src/checkout.ts and
  the checkout route in app/src/server.ts. Runs against an ephemeral copy of the app started
  from source at the given revision.
spec:
  config:
    revision:
      type: string
      default: main
      description: Git branch or commit SHA of github.com/olensmar/ql-testcon-demo to test
    pr:
      type: string
      default: ""
      description: Pull request number that triggered this run (for traceability)
  execution:
    tags:
      pr: "{{config.pr}}"
      revision: "{{config.revision}}"
  content:
    git:
      uri: https://github.com/olensmar/ql-testcon-demo
      revision: "{{config.revision}}"
      paths: [app, tests/api]
  services:
    shop:
      image: node:22-alpine
      transfer:
        - from: /data/repo/app
          to: /app
      shell: node /app/src/server.ts
      readinessProbe:
        httpGet:
          path: /healthz
          port: 3000
        periodSeconds: 1
  steps:
    - name: Run checkout API tests
      workingDir: /data/repo/tests/api
      run:
        image: postman/newman:6-alpine
        shell: >-
          newman run checkout.postman_collection.json
          --env-var baseUrl=http://{{services.shop.0.ip}}:3000
          --reporters cli,junit --reporter-junit-export /data/artifacts/junit.xml
      artifacts:
        paths: ["/data/artifacts/**"]
